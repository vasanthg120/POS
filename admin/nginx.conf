server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML pages (and /version.json) are revalidated on every load, so a new
    # deploy is picked up at once. Without this, browsers cache index.html
    # heuristically for days and keep running the previous build.
    #
    # Public pages are prerendered folders (/, /auth/login/, …). Signed-in
    # pages render in the browser (src/app/app.routes.server.ts), so they fall
    # back to the client shell. Falling back to /index.html — the prerendered
    # homepage — would hydrate the homepage's markup on another route.
    location / {
        try_files $uri $uri/ /index.csr.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
