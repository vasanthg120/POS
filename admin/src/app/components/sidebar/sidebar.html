<!-- Mobile overlay -->
<div class="sidebar-overlay" [class.visible]="mobileOpen()" (click)="closeMobile()"></div>

<!-- Sidebar -->
<aside class="sidebar" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-logo-wrap">
      <img src="../../../assets/images/fp.png" alt="POS Logo" class="brand-img">
      <div class="brand-icon-collapsed">
        <img src="../../../assets/images/log.png" alt="POS Logo">
      </div>
    </div>

    <!-- Collapse toggle — desktop only -->
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Main nav -->
  <div class="nav-section-label">Main</div>
  <nav class="sidebar-nav" aria-label="Main navigation">
    <a
      *ngFor="let item of mainNavItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="collapsed() ? item.label : null"
      (click)="closeMobile()"
    >
      <span class="nav-icon" [innerHTML]="item.icon" aria-hidden="true"></span>
      <span class="nav-label">{{ item.label }}</span>
      <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
      <span class="nav-badge collapsed-badge" *ngIf="item.badge && collapsed()">{{ item.badge }}</span>
    </a>
  </nav>

  <!-- Admin nav -->
  <div class="nav-section-label" *ngIf="adminNavItems.length">Admin</div>
  <nav class="sidebar-nav admin-nav" aria-label="Admin navigation" *ngIf="adminNavItems.length">
    <a
      *ngFor="let item of adminNavItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [attr.title]="collapsed() ? item.label : null"
      (click)="closeMobile()"
    >
      <span class="nav-icon" [innerHTML]="item.icon" aria-hidden="true"></span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-spacer"></div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar" [title]="userName">{{ userInitials }}</div>
      <div class="user-details">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
      <button class="icon-btn logout-icon-btn" (click)="logout()" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

</aside>
