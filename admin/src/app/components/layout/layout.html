<!-- App shell -->
<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()">

  <!-- Sidebar -->
  <app-sidebar
    #sidebarRef
    (collapseChange)="onCollapseChange($event)"
  ></app-sidebar>

  <!-- Right column -->
  <div class="app-body">

    <!-- Header — receives collapsed state for left-offset sync -->
    <app-header
      [sidebarCollapsed]="sidebarCollapsed()"
      (menuToggle)="sidebarRef.toggleMobile()"
    ></app-header>

    <!-- Page content -->
    <main class="app-main">
      <!-- <div class="page-content"> -->
        <router-outlet></router-outlet>
      <!-- </div> -->
    </main>

  </div>
</div>
