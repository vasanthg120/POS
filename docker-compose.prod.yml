services:
  backend:
    image: ghcr.io/vasanthg120/pos-backend:${IMAGE_TAG:-latest}
    container_name: pos-backend
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3000"
      ENABLE_STARTUP_SEEDS: "false"
      ENABLE_BILLING_CRON: "true"
      ENABLE_CRM_SYNC_CRON: "true"
    volumes:
      - /var/www/html/Backend/.env.production:/app/.env.production:ro
      - /var/www/html/Backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    image: ghcr.io/vasanthg120/pos-frontend:${IMAGE_TAG:-latest}
    container_name: pos-frontend
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
