# Backend API routes that live outside /api/ — pos.pantheras.io
#
# The backend (Backend/app.js) serves these prefixes without an /api prefix:
#   /tenant/quotes      CRM quotes, sync status, Sync now, tracking   (Tracking, Dashboard, Settings → CRM)
#   /tenant/statements  Razorpay statements                            (Dashboard, Tracking)
#   /tenant/royalty     royalty report                                 (Royalty)
#   /tenant/margin-jobs margin calculator jobs                         (Margin calculator)
#   /tenant/settings    tenant settings (router in app.js)
#   /public/            customer payment page lookups                  (/pay/:slug)
#   /payments/<sub>     customer checkout, Razorpay verify, receipts   (/pay/:slug)
#
# On pos.pantheras.io only /api/ was proxied, so every request above got the
# Angular index.html (GET → 200 text/html) or nginx's 405 page (POST): the
# Tracking page came up empty, CRM sync status/Sync now could not work, and
# the customer payment page could not load or create orders.
#
# Install: copy to /etc/nginx/snippets/pos-backend-routes.conf, add
#     include /etc/nginx/snippets/pos-backend-routes.conf;
# inside the existing HTTPS `server { … }` block for pos.pantheras.io (next to
# the existing `location /api/`), then `sudo nginx -t && sudo systemctl reload nginx`.
#
# The backend listens on 127.0.0.1:3000 (docker-compose.prod.yml, network_mode: host).
# proxy_pass has no URI part, so the request path is passed through unchanged.

location /tenant/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # "Sync now" pulls every quote from the CRM before answering.
    proxy_read_timeout 120s;
}

location /public/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Sub-paths only. /payments and /payments/ are the Angular "Payment Status"
# page and must stay with the frontend (a plain `location /payments/` would
# also send the page itself to the backend and break reloading it).
location ~ ^/payments/.+ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
