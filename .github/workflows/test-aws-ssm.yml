
name: Test AWS SSM Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pos-aws-ssm-connectivity-test
  cancel-in-progress: false

jobs:
  test-ssm:
    name: Verify GitHub OIDC to AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubPOSSSMConnectivityTest

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send harmless command to POS EC2
        id: send-command
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions SSM connectivity test" \
            --parameters 'commands=["echo SSM_CONNECTIVITY_OK","hostname","date -u"]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted successfully."

      - name: Wait for SSM command
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command failed with status: $STATUS"
                exit 1
                ;;
              Pending|InProgress|Delayed|Unknown|"")
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command."
          exit 1

      - name: Display command result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
